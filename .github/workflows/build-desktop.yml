name: Build Desktop App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install orchestrator deps
        run: cd local-orchestrator && npm install

      - name: Build Tauri app
        run: cd desktop-shell/src-tauri && cargo-tauri build

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: gemork-windows-exe
          path: desktop-shell/src-tauri/target/release/gemork-desktop.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: gemork-windows-msi
          path: desktop-shell/src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install orchestrator deps
        run: cd local-orchestrator && npm install

      - name: Build Tauri app
        run: cd desktop-shell/src-tauri && cargo-tauri build

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: gemork-linux-deb
          path: desktop-shell/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gemork-linux-appimage
          path: desktop-shell/src-tauri/target/release/bundle/appimage/*.AppImage
