name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    needs: []

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build orchestrator
        run: npm run build:orchestrator

      - name: Upload orchestrator build
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-dist
          path: local-orchestrator/dist/
          retention-days: 7

      - name: Build browser extension
        working-directory: browser-extension
        run: |
          npm install
          npm run build

      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: browser-extension/dist/
          retention-days: 7
