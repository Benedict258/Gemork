<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.connected {
      background: #22c55e;
    }
    .mode-toggle {
      display: flex;
      gap: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active-ask {
      background: #2563eb;
      color: #fff;
    }
    .mode-btn.active-act {
      background: #f97316;
      color: #fff;
    }
    .mode-btn:hover:not(.active-ask):not(.active-act) {
      background: #334155;
    }
    .mode-label {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-bottom: 16px;
    }
    .responses {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .response {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid #334155;
      white-space: pre-wrap;
    }
    .response.agent {
      border-left: 3px solid #2563eb;
    }
    .response.error {
      border-left: 3px solid #ef4444;
      color: #fca5a5;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .input-row input:focus {
      border-color: #2563eb;
    }
    .input-row button {
      background: #2563eb;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-row button:hover {
      background: #1d4ed8;
    }
    .input-row button:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .api-key-section {
      margin-top: 12px;
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .api-key-section label {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .api-key-row {
      display: flex;
      gap: 6px;
    }
    .api-key-row input {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      color: #e0e0e0;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .api-key-row input:focus {
      border-color: #2563eb;
    }
    .api-key-row button {
      background: #2563eb;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .api-key-row button:hover {
      background: #1d4ed8;
    }
    .api-key-hint {
      font-size: 10px;
      color: #475569;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Gemork</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Disconnected</span>
    </div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active-ask" id="askBtn" data-mode="ask">Ask</button>
    <button class="mode-btn" id="actBtn" data-mode="act">Act</button>
  </div>
  <div class="mode-label" id="modeLabel">Ask mode — read-only access</div>

  <div class="responses" id="responses"></div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Ask Gemork anything..." />
    <button id="sendBtn">Send</button>
  </div>

  <div class="api-key-section">
    <label>API Key</label>
    <div class="api-key-row">
      <input type="text" id="apiKeyInput" placeholder="Paste your API key..." />
      <button id="saveApiKeyBtn">Save</button>
    </div>
    <div class="api-key-hint">Found in server startup logs or .gemork/auth.json</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
